# Checks run before each commit: `pip install pre-commit && pre-commit install`.
# git-secrets must be installed (https://github.com/awslabs/git-secrets) and needs its patterns once per
# clone: `git secrets --register-aws`.
repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.57.2
    hooks:
      - id: cfn-lint
        files: ^templates/.*\.yaml$
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.29
    hooks:
      - id: checkov
        files: ^templates/.*\.yaml$
        args: ["--framework", "cloudformation,secrets", "--compact", "--quiet"]
  - repo: local
    hooks:
      - id: git-secrets
        name: git-secrets (AWS credentials)
        entry: git secrets --scan
        language: system
        pass_filenames: false
      - id: unit-tests
        name: unit tests (no AWS access)
        entry: python3 -m unittest discover -s tests
        language: system
        pass_filenames: false
        types: [python]
